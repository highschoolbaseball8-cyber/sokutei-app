@media(max-width:620px){main{padding:10px 10px 34px}section{padding:12px}.hero{grid-template-columns:1fr;padding:14px}.hero-r{order:2}.radar{max-width:310px}.hero-name{font-size:24px}.hs-num{font-size:50px}.cards2,.boards{grid-template-columns:1fr}.pitch-flex{grid-template-columns:1fr}.move{margin:auto}.rank li{grid-template-columns:24px minmax(55px,1fr) minmax(45px,1.1fr) auto;column-gap:5px;padding:7px 1px}.val{font-size:13px}.flabel{width:54px}.mc-val{font-size:28px}}@media(max-width:350px){nav{padding:8px}nav button{padding:6px 9px;font-size:12px}.hero-tags{display:block}.tag{margin:2px 2px 2px 0}.rank li{grid-template-columns:23px minmax(47px,1fr) minmax(35px,1fr) auto}.who{font-size:12px}.board{padding:10px}.board-sub{font-size:10px}}@media(min-width:760px){main{padding:18px 20px 48px}.hero{grid-template-columns:minmax(250px,1fr) 340px}.cards2,.boards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:1050px){.cards2{grid-template-columns:repeat(3,minmax(0,1fr))}}@media print{nav{display:none}body{background:#fff}section{box-shadow:none;break-inside:avoid}.hero{color:#1d2330;background:#fff;border:1px solid #dde1e7}.hero-meta,.legend{color:#5a6270}.ring{stroke:#9aa3b0}.spoke{stroke:#c5ccd6}.rlabel{fill:#1d2330;stroke:#fff}.rval{fill:#9a5200}}

/* Claude追加（11/16 v3）：見立て・左右の可動域・変化球の提案。色はCodexの配色から選んだもの */
.dg-type{margin-top:9px;font-size:13px;line-height:1.55;color:#ffffffcc}.dg-type b{color:#fff}
.dg-badge{display:inline-block;margin-right:6px;padding:2px 9px;border-radius:999px;background:#fff;color:#1f3a5f;font-size:12px;font-weight:800}
.diag h2{margin:0 0 8px;font-size:16px;color:#1f3a5f}
.dg-h{margin:2px 0 4px;font-size:13px;font-weight:800;color:#9a5200}
.dg-list{margin:0 0 8px;padding-left:18px;font-size:13px;line-height:1.6}
.dg-line{margin:8px 0;padding:8px 10px;border-left:4px solid #3975b8;border-radius:8px;background:#f0f6fc;font-size:13px}

.rjoints{display:grid;grid-template-columns:1fr;gap:10px}

.rj-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px;align-items:baseline;margin-bottom:8px;font-weight:800;color:#1f3a5f}

.rj-side{padding:8px 10px;border:1px solid #e7ebef;border-radius:10px;background:#f7f9fb}
.rj-side.key{border-color:#3975b8;background:#f0f6fc}
.rj-sh{display:flex;align-items:center;gap:6px;margin-bottom:6px}.rj-sh b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#1f3a5f;color:#fff;font-size:14px}
.rj-tag{padding:1px 7px;border-radius:999px;background:#fff0d8;color:#9a5200;font-size:11px;font-weight:800}
.rj-row{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:0 6px;padding:3px 0;border-top:1px dashed #e7ebef}
.rj-k{font-size:12px;color:#5a6270}.rj-v{text-align:right;font-size:18px;font-weight:800}.rj-v.low{color:#c0392b}
.rj-p{grid-column:1/-1;text-align:right;font-size:11px;color:#8b95a1}
.romcheck h3{margin:0 0 6px}.romcheck ul{margin:0;padding:0;list-style:none}

.romcheck li.warn{background:#fff8ec}
.plan{margin-bottom:10px;padding:10px 12px;border-radius:10px;background:#f0f6fc;font-size:13px;line-height:1.6}
.plan-q{font-size:14px;color:#1f3a5f}.plan p{margin:5px 0}
.plan-have{color:#176438}.plan-want{color:#1f3a5f;font-weight:700}.plan-maybe{color:#5a6270}
.mv-want{fill:#ffffffb8;stroke:#3975b8;stroke-width:2;stroke-dasharray:4 3}.mv-want.maybe{stroke:#aeb8c4}
.mv-wlab{fill:#245792;font-size:9px;font-weight:800}

.fz{stroke:#fff;stroke-width:1}.fz-v0{fill:#dce8f7}.fz-v1{fill:#f0f6fc}.fz-v2{fill:#dff4e7}.fz-v3{fill:#fff8ec}.fz-v4{fill:#fff0d8}

<title>測定</title><meta name="robots" content="noindex"></head>
<body>
<header><h1 id="title">測定</h1><div class="sub" id="sub"></div></header>
<nav id="nav"></nav>
<main id="main"><section><p>読み込み中…</p></section></main>
<div id="toast"></div>
<script>window.API_URL = "https://script.google.com/macros/s/AKfycbwLK1pqI8R41ZZtuhxDDVJoAth0fC_oNyAPPbvxGAXX63WsG-BUD-T4oJyVUkppNn3q/exec";</script>
<script>
// ===== サーバーとのやりとり =====
var API_URL = window.API_URL || '';
function call(action, payload) {
  if (!window.google || !google.script) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ pin: S.pin, action: action, payload: payload || {} }) })
      .then(function (r) { return r.json(); }).then(function (r) { if (r && r.ok) return r.data; throw new Error(r ? r.error : '通信エラー'); });
  }
  return new Promise(function (ok, ng) {
    google.script.run.withSuccessHandler(function (r) { r && r.ok ? ok(r.data) : ng(new Error(r ? r.error : '通信エラー')); })
      .withFailureHandler(ng).api(S.pin, action, payload || {});
  });
}
var S = { f: { pos: 'all', arm: 'all', grp: 'all' }, pin: localStorage.getItem('nh_pin') || '', me: JSON.parse(localStorage.getItem('nh_me') || 'null'), view: '', date: '', player: '', D: null, sortK: 'total', photo: null };
var $ = function (id) { return document.getElementById(id); };
function toast(t, ms) { var e = $('toast'); e.textContent = t; e.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.className = ''; }, ms || 2500); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var JP = function (d) { var a = d.split('-'); return a[0] + '年' + (+a[1]) + '月' + (+a[2]) + '日'; };
var SH = function (d) { var a = d.split('-'); return (+a[1]) + '/' + (+a[2]); };
var N = function (v) { return v === '' || v == null || isNaN(+v) ? null : +v; };

// ===== 入口 =====
async function start() {
  if (!S.pin) return drawLogin();
  try {
    S.D = await call('bootstrap', { me: S.me && S.me.name });
    build();
    S.date = S.D.today;
    if (S.D.role === 'player' && !S.me) return drawPickName();
    go(S.D.role === 'staff' ? 'status' : 'input');
  } catch (e) {
    if (String(e.message).indexOf('PIN_NG') >= 0) { localStorage.removeItem('nh_pin'); S.pin = ''; return drawLogin('暗証番号がちがいます'); }
    main('<section><p class="warn">' + esc(e.message) + '</p></section>');
  }
}
function main(h) { $('main').innerHTML = h; window.scrollTo(0, 0); }
function drawLogin(msg) {
  $('nav').innerHTML = '';
  main('<section><h2>暗証番号</h2><p class="note">選手はチームの番号、先生・トレーナーはスタッフ用の番号を入れてください。</p>' +
    '<input id="pin" type="password" inputmode="numeric" class="big-in" autocomplete="off"><button class="primary" id="go">入る</button>' +
    (msg ? '<p class="warn">' + esc(msg) + '</p>' : '') + '</section>');
  $('go').onclick = function () { S.pin = $('pin').value.trim(); localStorage.setItem('nh_pin', S.pin); start(); };
}
function drawPickName() {
  var names = NAMES();
  main('<section><h2>あなたの名前</h2><p class="note">去年測った人は一覧から。初めての人は「新しく入力」に書いてください。</p>' +
    '<select id="nm" class="big-in"><option value="">— 選ぶ —</option>' + names.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('') + '</select>' +
    '<input id="nm2" class="big-in" placeholder="新しく入力（フルネーム・漢字）">' +
    '<div class="row"><label>ポジション <select id="pos"><option>投手</option><option>野手</option></select></label>' +
    '<label>投げる腕 <select id="arm"><option>右投げ</option><option>左投げ</option></select></label></div>' +
    '<button class="primary" id="ok">これで始める</button></section>');
  $('nm').onchange = function () { var r = latest($('nm').value); if (r) { $('pos').value = r.pos || '投手'; $('arm').value = r.arm || '右投げ'; } };
  $('ok').onclick = function () {
    var n = ($('nm2').value || $('nm').value).trim().replace(/\s+/g, '');
    if (!n) return toast('名前を選ぶか入力してください');
    S.me = { name: n, pos: $('pos').value, arm: $('arm').value };
    localStorage.setItem('nh_me', JSON.stringify(S.me));
    start();
  };
}
function nav() {
  var tabs = S.D.role === 'staff'
    ? [['status', '入力状況'], ['team', 'チーム'], ['player', '選手ごと'], ['input', '入力する'], ['about', '項目の説明']]
    : [['input', '入力する'], ['mine', '自分の結果'], ['team', 'チームの順位'], ['about', '項目の説明']];
  $('nav').innerHTML = tabs.map(function (t) { return '<button data-v="' + t[0] + '" class="' + (S.view === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') +
    '<select id="selDate">' + DATES(true).map(function (d) { return '<option value="' + d + '"' + (d === S.date ? ' selected' : '') + '>' + JP(d) + (d === S.D.today ? '（今回）' : '') + '</option>'; }).join('') + '</select>' +
    (S.D.role === 'staff' && (S.view === 'player' || S.view === 'input') ? '<select id="selP">' + NAMES().map(function (n) { return '<option' + (n === S.player ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select>' : '') +
    (S.D.role === 'staff' ? '' : '<button class="ghost" id="sw">' + esc(S.me ? S.me.name : '') + '・名前を変える</button>') + '<button class="ghost" id="out">ログアウト</button>';
  $('nav').querySelectorAll('button[data-v]').forEach(function (b) { b.onclick = function () { go(b.dataset.v); }; });
  $('selDate').onchange = function () { S.date = this.value; go(S.view); };
  if ($('selP')) $('selP').onchange = function () { S.player = this.value; go(S.view); };
  $('out').onclick = function () { localStorage.removeItem('nh_pin'); localStorage.removeItem('nh_me'); S.pin = ''; S.me = null; drawLogin(); };
  if ($('sw')) $('sw').onclick = function () { localStorage.removeItem('nh_me'); S.me = null; drawPickName(); };
}
function go(v) {
  S.view = v;
  if (!S.player) S.player = S.me ? S.me.name : NAMES()[0];
  $('title').textContent = S.D.team + ' 測定';
  $('sub').textContent = S.D.role === 'staff' ? '先生・トレーナー用（全員のデータ）' : (S.me ? S.me.name + '（' + S.me.pos + '・' + S.me.arm + '）' : '');
  nav();
  ({ input: drawInput, mine: function () { drawPlayer(S.me.name); }, team: drawTeam, player: function () { drawPlayer(S.player); }, status: drawStatus, about: drawAbout })[v]();
}

// ===== データの組み立て（体の行＋投球の行 → 1人1日の記録） =====
var R = [], STAT = {}, RANKED = [];
function build() {
  var it = S.D.items;
  RANKED = [].concat(it.pitchRank.map(function (m) { m.g = 'ラプソード'; return m; }), it.vald.filter(function (m) { return m.rank; }).map(function (m) { m.g = 'VALD'; return m; }), it.extraRank.map(function (m) { m.g = '握力'; return m; }));
  var map = {};
  S.D.body.forEach(function (b) { var k = b.date + '|' + b.name; var o = map[k] = Object.assign({}, b); Object.keys(o).forEach(function (x) { if (['id', 'date', 'name', 'pos', 'arm', 'updated'].indexOf(x) < 0) o[x] = N(o[x]); }); o.pl = []; });
  S.D.pitches.forEach(function (p) { var k = p.date + '|' + p.name; if (!map[k]) map[k] = { date: p.date, name: p.name, pos: '', arm: '', pl: [] }; map[k].pl.push(p); });
  var know = {}; Object.keys(map).forEach(function (k) { var r = map[k], o = know[r.name] = know[r.name] || {}; if (r.pos) o.pos = r.pos; if (r.arm) o.arm = r.arm; if (r.ht != null && (!o.htd || r.date > o.htd)) { o.ht = r.ht; o.htd = r.date; } });
  R = Object.keys(map).map(function (k) {
    var r = map[k];
    if (r.ht == null && know[r.name] && know[r.name].ht != null) r.ht = know[r.name].ht;   // 身長を入れなかった日は、いちばん新しい身長で体重の目標を出す
    if (!r.pos && know[r.name]) r.pos = know[r.name].pos; if (!r.arm && know[r.name]) r.arm = know[r.name].arm;
    ['sh', 'hip'].forEach(function (j) { ['L', 'R'].forEach(function (s) { var a = r[j + '_ir_' + s], b = r[j + '_er_' + s]; if (r[j + '_ta_' + s] == null && a != null && b != null) r[j + '_ta_' + s] = a + b; }); });
    var by = {};
    r.pl.forEach(function (p) { (by[p.pt] = by[p.pt] || []).push(p); });
    r.pitches = {};
    Object.keys(by).forEach(function (t) {
      var ps = by[t], avg = function (f) { var v = ps.map(function (p) { return N(p[f]); }).filter(function (x) { return x != null; }); return v.length ? v.reduce(function (a, b) { return a + b; }, 0) / v.length : null; };
      var sp = ps.map(function (p) { return N(p.speed); }).filter(function (x) { return x != null; });
      r.pitches[t] = { n: ps.length, speed: avg('speed'), speedMax: sp.length ? Math.max.apply(null, sp) : null, spin: avg('spin'), eff: avg('eff'), tspin: avg('tspin'), gyro: avg('gyro'), vb: avg('vb'), hb: avg('hb'), ext: avg('ext'), rh: avg('rh'), rs: avg('rs'), rva: avg('rva') };
    });
    var st = r.pitches.ST || {};
    r.speed_max = st.speedMax == null ? null : st.speedMax; r.spin = st.spin == null ? null : st.spin; r.tspin = st.tspin == null ? null : st.tspin;
    r.eff = st.eff; r.gyro = st.gyro; r.vb = st.vb; r.hb = st.hb;
    r.grip_throw = r.arm === '左投げ' ? r.grip_L : r.grip_R;
    if (r.ci_ratio == null && r.ci != null && r.ci100 != null && r.ci > 0) r.ci_ratio = Math.round(r.ci100 / r.ci * 1000) / 10;   // 空欄なら 0.1秒の力÷踏み切る力
    return r;
  });
  STAT = {};
  DATES().forEach(function (d) {
    STAT[d] = {};
    var rs = R.filter(function (r) { return r.date === d; });
    RANKED.concat(S.D.items.vald.filter(function (m) { return m.k === 'bm'; })).forEach(function (m) {   // 体重は順位をつけないが、チームの画面に並べるので偏差値の元だけ出す
      var v = rs.map(function (r) { return r[m.k]; }).filter(function (x) { return x != null; });
      if (v.length < 3) { STAT[d][m.k] = null; return; }
      var mean = v.reduce(function (a, b) { return a + b; }, 0) / v.length;
      var sd = Math.sqrt(v.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / v.length);
      STAT[d][m.k] = { mean: mean, sd: sd, n: v.length, vals: v };
    });
  });
}
function DATES(withToday) { var s = {}; R.forEach(function (r) { s[r.date] = 1; }); if (withToday && S.D.today) s[S.D.today] = 1; return Object.keys(s).sort(); }
function NAMES() { var s = {}; R.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (r) { s[r.name] = 1; }); return Object.keys(s); }
function rec(d, n) { return R.filter(function (r) { return r.date === d && r.name === n; })[0]; }
function latest(n) { return R.filter(function (r) { return r.name === n; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; })[0]; }
function prevOf(r) { return R.filter(function (x) { return x.name === r.name && x.date < r.date; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; })[0]; }
function dev(r, k) { var s = STAT[r.date] && STAT[r.date][k], x = r[k]; if (!s || x == null || !s.sd) return null; return 50 + 10 * (x - s.mean) / s.sd; }
function rank(r, k) { var s = STAT[r.date] && STAT[r.date][k], x = r[k]; if (!s || x == null) return null; return { r: s.vals.filter(function (v) { return v > x; }).length + 1, n: s.n }; }
// 目標＝Progress社の高校3年生の最大値（世代のトップ）。達成率＝本人÷目標×100
function valdItem(k) { return S.D.items.vald.concat(S.D.items.extraRank).filter(function (m) { return m.k === k; })[0]; }
function goalOf(r, k) { var m = valdItem(k); if (!m) return null; if (m.goalBy === 'ht-90') return r.ht ? r.ht - 90 : null; return m.goal || null; }
function ach(r, k) { var g = goalOf(r, k), x = r[k]; return g && x != null ? x / g * 100 : null; }
function achAll(r) { var v = S.D.items.vald.filter(function (m) { return m.rank; }).map(function (m) { return ach(r, m.k); }).filter(function (x) { return x != null; }); return v.length >= 3 ? v.reduce(function (a, b) { return a + b; }, 0) / v.length : null; }
// 前回比は、両方で測った項目だけで平均を比べる（去年はPositive Takeoff Impulse・しゃがみ込みの力が無い）
function achDiff(p, r) { var ks = S.D.items.vald.filter(function (m) { return m.rank && ach(p, m.k) != null && ach(r, m.k) != null; }); if (ks.length < 2) return ''; var av = function (x) { return ks.reduce(function (a, m) { return a + ach(x, m.k); }, 0) / ks.length; }; return arrow(av(p), av(r), 'x'); }
var acls = function (a) { return a == null ? '' : a >= 100 ? 'd5' : a >= 90 ? 'd4' : a >= 80 ? 'd3' : a >= 70 ? 'd2' : 'd1'; };
function achBar(r, k) {
  var a = ach(r, k), g = goalOf(r, k), m = valdItem(k), x = r[k], gl = m && m.gl || '高3トップ';
  var uni = m && m.uni ? '<div class="ach-u"><span>大学生平均 ' + fmt(m.uni, k) + m.u + '</span>' + (x != null ? (x >= m.uni ? '<b class="ach-ok">超えた</b>' : '<span>あと ' + fmt(m.uni - x, k) + m.u + '</span>') : '') + '</div>' : '';
  if (a == null) return g ? '<div class="ach"><span class="ach-t">目標 ' + gl + ' ' + fmt(g, k) + m.u + (m.uni ? '／大学生平均 ' + fmt(m.uni, k) + m.u : '') + '</span></div>' : '';
  return '<div class="ach"><div class="ach-h"><span class="ach-t">' + gl + '（' + fmt(g, k) + m.u + '）に対して</span><b class="ach-n">' + Math.round(a) + '%</b></div><div class="ach-bar"><span class="ach-fill ' + acls(a) + '" style="width:' + Math.min(100, a) + '%"></span>' + (m.uni ? '<i class="ach-mk" style="left:' + Math.min(100, m.uni / g * 100) + '%"></i>' : '') + '</div>' + uni + '</div>';
}
function total(r) { var d = RANKED.map(function (m) { return dev(r, m.k); }).filter(function (x) { return x != null; }); return d.length >= 3 ? d.reduce(function (a, b) { return a + b; }, 0) / d.length : null; }
function fmt(v, k) { if (v == null) return '—'; var big = ['rfd', 'pp', 'spin', 'tspin'].indexOf(k) >= 0 || Math.abs(v) >= 1000; return big ? Math.round(v).toLocaleString() : (Math.round(v * 10) / 10).toString(); }
var dcls = function (x) { return x == null ? '' : x >= 65 ? 'd5' : x >= 57 ? 'd4' : x >= 50 ? 'd3' : x >= 43 ? 'd2' : 'd1'; };
var devTag = function (x) { return x == null ? '<span class="ref">—</span>' : '<span class="dev ' + dcls(x) + '">' + x.toFixed(0) + '</span>'; };
function diffTag(a, b, k, color) { if (a == null || b == null) return '<span class="ref">—</span>'; var d = b - a, s = (d > 0 ? '+' : '') + fmt(d, k); if (color === false) return '<span class="flat">' + s + '</span>'; return '<span class="' + (d > 0 ? 'up' : d < 0 ? 'down' : 'flat') + '">' + s + '</span>'; }

// 可動域：順位ではなく、基準と左右差で見る
function rom(r) {
  var T = r.arm === '左投げ' ? 'L' : 'R', Nn = T === 'R' ? 'L' : 'R', SD = { L: '左', R: '右' }, out = [], g = function (k) { return r[k]; };
  var dif = function (a, b) { return g(a) != null && g(b) != null ? g(a) - g(b) : null; };
  var c = function (label, val, ok, why, refOnly) { out.push({ label: label, val: val, st: val == null ? 'none' : refOnly ? 'ref' : ok ? 'ok' : 'warn', why: why }); };
  var ta = dif('sh_ta_' + T, 'sh_ta_' + Nn); c('肩のトータルアーク　投げる側−反対側', ta, ta != null && ta >= -5, '投げる側が5°より大きく少ないと、肩のけがが約1.9倍（Wilk 2011・プロ投手）');
  var er = dif('sh_er_' + T, 'sh_er_' + Nn); c('肩の外旋　投げる側−反対側', er, er != null && er >= 5, '投げる側の外旋が反対側より5°以上多くないと、肩のけがが約2.2倍（Wilk 2015）');
  var ir = dif('sh_ir_' + T, 'sh_ir_' + Nn); c('肩の内旋　投げる側−反対側（GIRD）', ir, ir != null && ir > -20, '参考。内旋が20°以上少ない＝GIRD。けがとのつながりははっきりしていない', true);
  c('肩の外旋（' + SD[T] + '・投げる側）', g('sh_er_' + T), g('sh_er_' + T) >= 120, '基準 120°以上（MAST）');
  c('肩のトータルアーク（' + SD[T] + '・投げる側）', g('sh_ta_' + T), g('sh_ta_' + T) >= 160, '基準 160〜190°（MAST）');
  c('股関節の内旋（' + SD[Nn] + '・踏み出し脚）', g('hip_ir_' + Nn), g('hip_ir_' + Nn) >= 45, '基準 45°以上（MAST）。踏み出し脚の内旋が少ないと、けがが増えるという報告がある');

      out += '<li class="' + (r.name === meN ? 'me' : '') + (i < 3 ? ' top' + (i + 1) : '') + '"><span class="pos">' + (i + 1) + '</span>' +
        '<span class="who">' + (staff ? '<a href="#" data-n="' + esc(r.name) + '">' + esc(r.name) + '</a>' : esc(r.name)) + '<small>' + esc(r.pos || '') + '</small></span>' +
        '<span class="bar-wrap"><span class="rbar ' + (key === 'ach' ? acls(v) : dcls(dv)) + '" style="width:' + w + '%"></span></span>' +
        '<span class="val">' + (key === 'total' ? v.toFixed(0) : key === 'ach' ? Math.round(v) + '%' : fmt(v, key)) + '</span>' +
        '<span class="sub2">' + (key === 'total' || key === 'ach' ? '' : '偏差値 ' + (dv == null ? '—' : dv.toFixed(0)) + (ach(r, key) != null ? '・' + (valdItem(key).gl || (valdItem(key).goalBy === 'ht-90' ? '身長−90' : '高3トップ')) + 'の' + Math.round(ach(r, key)) + '%' : '')) + (p ? ' ' + (key === 'ach' ? achDiff(p, r) : arrow(key === 'total' ? total(p) : p[key], v, key)) : '') + '</span></li>';
    });
    return out + '</ol>' + (key !== 'total' && key !== 'ach' ? explain(key) : '') + '</section>';
  };
  var QR = quadRows(S.date);
  if (QR.length) h += '<section class="quadsec"><h2>VALD × ラプソードの4つの型（チーム）</h2>' + quadChart(QR, null, true) + '<p class="note">右上＝' + QUAD.hh.name + '／右下＝' + QUAD.hl.name + '／左上＝' + QUAD.lh.name + '／左下＝' + QUAD.ll.name + '。選手の画面に、型ごとの練習の方向が出ます。</p></section>';
  h += '<div class="boards">' + board('総合偏差値', 'total', rs, total, '順位をつける項目の偏差値の平均');
  if (S.f.grp === 'all' || S.f.grp === 'VALD') h += board('VALD　高3トップに対して', 'ach', rs, achAll, 'VALD6項目の達成率の平均（100%＝高校3年生のトップ）');
  RANKED.forEach(function (m) { if (S.f.grp !== 'all' && S.f.grp !== m.g) return; if (m.k === 'jh') h += board('Body Mass', 'bm', rs, function (r) { return r.bm; }, '体重・kg・目標 身長−90（総合偏差値には入れない）'); h += board(m.l, m.k, rs, function (r) { return r[m.k]; }, (m.en ? m.en + '・' : '') + m.u + (m.goal ? '・' + (m.gl || '高3トップ') + ' ' + m.goal + m.u + (m.uni ? '・大学生平均 ' + m.uni + m.u : '') : m.ref ? '・基準 ' + m.ref : '')); });
  if (staff) {
    var warn = rs.map(function (r) { return { r: r, w: noRom(r) ? [] : rom(r).filter(function (x) { return x.st === 'warn'; }) }; }).filter(function (x) { return x.w.length; });
    if (warn.length) h += '<section class="board romwarn"><div class="board-h"><h2>可動域で注意がある選手</h2><span class="board-sub">先生・トレーナーだけに表示</span></div><ul>' + warn.map(function (x) { return '<li><a href="#" data-n="' + esc(x.r.name) + '">' + esc(x.r.name) + '</a>：' + x.w.map(function (w) { return w.label; }).join('／') + '</li>'; }).join('') + '</ul></section>';
  }
  h += '</div>';
  main(h);
  document.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { S.f[b.dataset.fk] = b.dataset.fv; drawTeam(); }; });
  document.querySelectorAll('a[data-n]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); S.player = a.dataset.n; go('player'); }; });
}

// ===== 1人 =====
function bmCard(r, p) {
  return '<section class="mcard"><div class="mc-h"><span class="mc-name">Body Mass</span><span class="mc-en">体重（順位はつけない）</span></div>' +
    '<div class="mc-body"><span class="mc-val">' + fmt(r.bm) + '<small>kg</small></span>' + (p ? arrow(p.bm, r.bm) : '') + '</div>' + achBar(r, 'bm').replace('高3トップ', '身長−90') + explain('bm', r) + '</section>';
}
function drawPlayer(n) {
  var rs = R.filter(function (r) { return r.name === n; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  if (!rs.length) return main('<section><h2>' + esc(n) + '</h2><p>まだ記録がありません。「入力する」から入れてください。</p></section>');
  var last = rs.filter(function (r) { return r.date <= S.date; }).pop() || rs[rs.length - 1];
  var prev = prevOf(last);
  var items = RANKED.filter(function (m) { return EXPLAIN[m.k]; });
  var now = items.map(function (m) { return dev(last, m.k); }), pv = prev ? items.map(function (m) { return dev(prev, m.k); }) : null;
  var t = total(last), tp = prev ? total(prev) : null;
  // 伸びた・伸ばしたい
  var DG = diagnose(last);
  var good = items.map(function (m, i) { return { m: m, v: now[i] }; }).filter(function (x) { return x.v != null; }).sort(function (a, b) { return b.v - a.v; });
  var h = (last.date !== S.date ? '<section><p class="warn">⚠️ ' + JP(S.date) + 'の記録はまだありません。' + (last.date < S.date ? '前回' : 'ほかの日') + '（' + JP(last.date) + '）の結果を出しています</p></section>' : '') +
    '<section class="hero"><div class="hero-l"><div class="hero-name">' + esc(n) + '</div><div class="hero-meta">' + esc(last.pos || '') + '・' + esc(last.arm || '') + '　' + JP(last.date) + '</div>' +
    '<div class="hero-score"><span class="hs-label">総合偏差値</span><span class="hs-num">' + (t == null ? '—' : t.toFixed(0)) + '</span>' + (tp != null && t != null ? arrow(tp, t, 'x') : '') + '</div>' +
    (achAll(last) != null ? '<div class="hero-ach"><span class="hs-label">VALD　高3トップに対して</span><b>' + Math.round(achAll(last)) + '%</b>' + (prev ? achDiff(prev, last) : '') + '</div>' : '') +
    (good.length ? '<div class="hero-tags"><span class="tag good">強み：' + good.slice(0, 2).map(function (x) { return EXPLAIN[x.m.k].s; }).join('・') + '</span><span class="tag work">伸びしろ：' + good.slice(-2).reverse().map(function (x) { return EXPLAIN[x.m.k].s; }).join('・') + '</span></div>' : '') +
    (DG.type && DG.type[0] ? '<div class="dg-type"><span class="dg-badge">' + DG.type[0] + '</span>' + DG.type[1] + '</div>' : (DG.type ? '<div class="dg-type">' + DG.type[1] + '</div>' : '')) +
    '</div><div class="hero-r">' + radar(items, now, pv) + '<div class="legend"><i class="lg-now"></i>' + SH(last.date) + (prev ? '<i class="lg-prev"></i>' + SH(prev.date) + '（前回）' : '') + '<span>線の外ほどチームの中で上（真ん中の太線＝50）</span></div></div></section>';
  h += quadSection(last, DG);
  h += '<section class="diag"><h2>この選手の見立て</h2>' + (good.length ? '<div class="dg-h">伸びしろが、投球にどうつながるか</div><ul class="dg-list">' + growthLinks(items, now) + '</ul>' : '') +
    DG.lines.map(function (l) { return '<div class="dg-line' + (l[0].indexOf('⚠️') === 0 ? ' risk' : '') + '"><b>' + l[0] + '</b><p>' + l[1] + '</p></div>'; }).join('') +
    '<p class="note">タイプ分けは、VALD6項目の偏差値の平均とラプソード3項目の偏差値の平均を、チームの真ん中（50）で分けたもの。「高3トップ」はProgress社が測った高校3年生の最大値（世代のトップ）。グラフの縦線は大学生の平均値。1回の測定での位置なので、断定ではありません。</p></section>';
  var g = '';
  h += '<div class="cards2">';
  items.forEach(function (m) {
    if (m.g !== g) { g = m.g; h += '<h2 class="grp">' + g + '</h2>' + (g === 'VALD' ? bmCard(last, prev) : ''); }
    var v = last[m.k], dv = dev(last, m.k), k = rank(last, m.k);
    h += '<section class="mcard"><div class="mc-h"><span class="mc-name">' + m.l + '</span>' + (m.en ? '<span class="mc-en">' + m.en + '</span>' : '') + '</div>' +
      '<div class="mc-body"><span class="mc-val">' + fmt(v, m.k) + '<small>' + m.u + '</small></span>' + (prev ? arrow(prev[m.k], v, m.k) : '') + '</div>' +
      '<div class="mc-rank">' + (k ? '<b>' + k.n + '人中 ' + k.r + '位</b>' : '—') + '<span>偏差値 ' + (dv == null ? '—' : dv.toFixed(0)) + '</span></div>' + meter(dv) + (m.goal ? achBar(last, m.k) : '') + explain(m.k, last) + '</section>';
  });
  h += '</div><p class="note">' + VALD_NOTE + '</p>';
  // 可動域：部位ごとに左右を並べ、下に判定
  var rr = rom(last);
  if (!noRom(last)) h += '<h2 class="grp">可動域（順位はつけず、基準と左右差で見る）</h2><div class="rjoints">' + romJoints(last, romPrev(last)) + '</div>';
  // 球の中身
  var FB = fbClass(last);
  h += '<h2 class="grp">球の中身（順位はつけない）</h2><section class="pitchsec"><div class="pitch-flex"><div>' + movement(last) + '<p class="note">点＝球種ごとの平均。色の帯＝ストレートの区分（縦：伸び・標準・垂れ／横：カット寄り・標準・シュート寄り）。上ほど「伸びる」、右ほど「シュート」' + (last.arm === '左投げ' ? '（左投手なので左右を反転して表示）' : '') + '。</p></div><div class="pitch-info">' +
    (FB ? '<div class="plan"><div class="plan-q">ストレートの変化量</div><p class="fb-cls"><span class="fbv fbv-' + FB.vi + '">縦：' + FB.v + '</span><span class="fbh fbh-' + FB.hi + '">横：' + FB.h + '</span></p><p class="note">縦 ' + fmt(last.vb) + 'cm・横 ' + fmt(last.hb) + 'cm（ストレートの平均）。縦は18インチ（45.7cm）以上＝伸び／14〜16インチ（35.6〜40.6cm）＝標準／10インチ（25.4cm）以下＝垂れ。横は8インチ（20.3cm）以下＝カット寄り／8〜12インチ＝標準／12インチ（30.5cm）以上＝シュート寄り（ピッチングマスタークラスの定義）' + (last.arm === '左投げ' ? '（左投手は左右を反転して判定）' : '') + '。</p></div>' : '');
  ['eff', 'gyro', 'vb', 'hb'].forEach(function (k) {
    h += '<div class="pi"><span class="pi-n">' + EXPLAIN[k].s + '（ストレート）</span><span class="pi-v">' + fmt(last[k]) + '</span>' + (prev ? '<span class="pi-p">前回 ' + fmt(prev[k]) + '</span>' : '') + explain(k) + '</div>';
  });
  h += '</div></div>' + secondary(last) + '<details class="ex"><summary>球種ごとの数字（表）</summary><div class="scroll"><table><tr><th class="l">球種</th><th>球数</th><th>平均球速</th><th>最高球速</th><th>回転数</th><th>トゥルースピン</th><th>回転効率</th><th>ジャイロ</th><th>縦変化</th><th>横変化</th><th>エクステンション</th><th>リリース高</th><th>リリース角(縦)</th></tr>';
  Object.keys(last.pitches).sort(function (a, b) { return a === 'ST' ? -1 : b === 'ST' ? 1 : 0; }).forEach(function (tt) {
    var x = last.pitches[tt]; h += '<tr><td class="l">' + tt + '</td><td>' + x.n + '</td><td>' + fmt(x.speed) + '</td><td>' + fmt(x.speedMax) + '</td><td>' + fmt(x.spin, 'spin') + '</td><td>' + fmt(x.tspin, 'tspin') + '</td><td>' + fmt(x.eff) + '</td><td>' + fmt(x.gyro) + '</td><td>' + fmt(x.vb) + '</td><td>' + fmt(x.hb) + '</td><td>' + (x.ext == null ? '—' : x.ext.toFixed(2)) + '</td><td>' + (x.rh == null ? '—' : x.rh.toFixed(2)) + '</td><td>' + fmt(x.rva) + '</td></tr>';
  });
  h += '</table></div></details></section>';
  // これまでの推移
  if (rs.length > 1) {
    h += '<details class="ex history"><summary>これまでの記録（' + rs.length + '回）</summary><div class="scroll"><table><tr><th class="l">項目</th>' + rs.map(function (r) { return '<th>' + SH(r.date) + '</th>'; }).join('') + '</tr>';
    [{ k: 'bm', l: 'Body Mass（体重）' }].concat(items).forEach(function (m) { h += '<tr><td class="l">' + m.l + '</td>' + rs.map(function (r) { return '<td>' + fmt(r[m.k], m.k) + '</td>'; }).join('') + '</tr>'; });
    h += '</table></div></details>';
  }
  main(h);
}

// ===== 入力状況（先生・トレーナー） =====
function drawStatus() {
  var d = S.date, it = S.D.items;
  var names = NAMES();
  var has = function (r, list) { if (!r) return 0; return list.filter(function (m) { return r[m.k] != null; }).length; };
  var h = '<section><h2>' + JP(d) + '　入力状況</h2><p class="note">去年までに測った人＋今回入れた人。数字は「入った項目の数／全部の数」。名前を押すとその人の結果。</p><div class="scroll"><table><tr><th class="l">名前</th><th>ラプソード（球数）</th><th>VALD</th><th>可動域</th><th>握力</th><th>体</th><th class="l">最後に入れた時刻</th></tr>';
  names.forEach(function (n) {
    var r = rec(d, n);
    var cell = function (k, all) { return '<td class="' + (k === 0 ? 'warn' : k < all ? 'part' : 'ok') + '">' + k + '／' + all + '</td>'; };
    h += '<tr><td class="l"><a href="#" data-n="' + esc(n) + '">' + esc(n) + '</a></td>' +
      '<td class="' + (r && r.pl.length ? 'ok' : 'warn') + '">' + (r ? r.pl.length : 0) + '球</td>' + cell(has(r, it.vald), it.vald.length) + (NO_ROM_DATES.indexOf(d) >= 0 ? '<td class="ref">今回なし</td>' : cell(has(r, it.rom), it.rom.length)) + cell(has(r, it.grip), it.grip.length) + cell(has(r, it.info), it.info.length) +
      '<td class="l ref">' + (r && r.updated ? esc(String(r.updated).replace('T', ' ').slice(0, 16)) : '') + '</td></tr>';
  });
  h += '</table></div>' + (S.D.sheetUrl ? '<p><a href="' + S.D.sheetUrl + '" target="_blank">スプレッドシート（元のデータ）を開く</a></p>' : '') + '</section>';
  main(h);
  document.querySelectorAll('a[data-n]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); S.player = a.dataset.n; go('player'); }; });
}

function drawAbout() {
  var card = function (k) { var e = EXPLAIN[k]; return '<section class="mcard"><div class="mc-h"><span class="mc-name">' + (e.en || e.s) + '</span>' + (e.en ? '<span class="mc-en">' + e.s + '</span>' : '') + '</div><p>' + e.what + '</p><p class="note">' + e.read + '</p></section>'; };
  main('<h2 class="grp">ラプソード（投球）</h2><div class="cards2">' + ['speed_max', 'spin', 'tspin', 'eff', 'gyro', 'vb', 'hb'].map(card).join('') + '</div>' +
    '<h2 class="grp">VALD（反動をつけたジャンプ）</h2><p class="note">VALDは、1回のジャンプを「しゃがむ（ブレーキ）→ 押す → 跳ぶ」に分けて測ります。野球にいちばん近いのは<b>ブレーキ</b>の局面＝投球の踏み出し脚、打撃の踏み込みで「前に進む体を止めて、回転に変える」動きです。</p><div class="cards2">' + ['bm', 'jh', 'pti', 'ci', 'ci100', 'ci_ratio', 'edi'].map(card).join('') + '</div><p class="note">' + VALD_NOTE + '</p>' +
    '<h2 class="grp">握力・可動域</h2><div class="cards2">' + card('grip_throw') +
    '<section class="mcard"><div class="mc-h"><span class="mc-name">可動域</span></div><p>広いほど良いわけではないので、<b>順位はつけません</b>。基準に届いているかと、左右の差で見ます。</p><p class="note">肩は、投げる側のトータルアーク（内旋＋外旋）が反対側より5°より大きく少ないと、肩のけがが約1.9倍。投げる側の外旋が反対側より5°以上多くないと約2.2倍（プロ投手の研究・Wilk 2011/2015）。全員分は先生・トレーナーの画面だけに出ます。</p></section></div>' +
    '<section><h2>「高3トップに対して◯%」の見かた</h2><p>VALDの目標値は、Progress社が測った<b>高校3年生のデータの最大値</b>＝世代のトップの数字です。自分の数字 ÷ 目標値で、トップに対して何%まで来ているかを出しています（体重だけは、身長−90が目標）。100%で、高校3年生のトップと同じ水準。もう1つの目標として<b>大学生の平均値</b>も並べています（グラフの縦線）。縦線を超えれば大学生の平均より上です。チームの偏差値とちがって、<b>ほかの人が入力しても動きません</b>。</p></section><section><h2>偏差値の見かた</h2><p>50＝チームの真ん中、60＝上から約16%、40＝下から約16%。<b>同じ日に測った十数人の中での位置</b>なので、全国の基準ではありません。今回の分は、入力した人が増えるたびに少し動きます。</p></section>');
}

start();
</script>
</body></html>
