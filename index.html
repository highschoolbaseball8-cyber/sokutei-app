<script>window.API_URL = "https://script.google.com/macros/s/AKfycbwLK1pqI8R41ZZtuhxDDVJoAth0fC_oNyAPPbvxGAXX63WsG-BUD-T4oJyVUkppNn3q/exec";</script>
<script>
// ===== サーバーとのやりとり =====
var API_URL = window.API_URL || '';
function call(action, payload) {
  if (!window.google || !google.script) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ pin: S.pin, action: action, payload: payload || {} }) })
      .then(function (r) { return r.json(); }).then(function (r) { if (r && r.ok) return r.data; throw new Error(r ? r.error : '通信エラー'); });
  }
  return new Promise(function (ok, ng) {
    google.script.run.withSuccessHandler(function (r) { r && r.ok ? ok(r.data) : ng(new Error(r ? r.error : '通信エラー')); })
      .withFailureHandler(ng).api(S.pin, action, payload || {});

var S = { f: { pos: 'all', arm: 'all', grp: 'all' }, pin: localStorage.getItem('nh_pin') || '', me: JSON.parse(localStorage.getItem('nh_me') || 'null'), view: '', date: '', player: '', D: null, sortK: 'total', photo: null };
var $ = function (id) { return document.getElementById(id); };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var JP = function (d) { var a = d.split('-'); return a[0] + '年' + (+a[1]) + '月' + (+a[2]) + '日'; };
var SH = function (d) { var a = d.split('-'); return (+a[1]) + '/' + (+a[2]); };
var N = function (v) { return v === '' || v == null || isNaN(+v) ? null : +v; };

// ===== 入口 =====
async function start() {
  if (!S.pin) return drawLogin();
  try {
    S.D = await call('bootstrap', { me: S.me && S.me.name });
    build();

  [-60, -30, 30, 60].forEach(function (v) { h += '<line class="mv-grid" x1="' + (c + v * s) + '" y1="0" x2="' + (c + v * s) + '" y2="300"/><line class="mv-grid" x1="0" y1="' + (c - v * s) + '" x2="300" y2="' + (c - v * s) + '"/>'; });
  // ストレートの区分（右投手基準の cm）：縦＝伸び/標準/垂れ、横＝スライダー寄り/標準/シュート寄り
  var VB = [['伸び', 47, 70], ['標準', 39, 47], ['垂れ', 15, 39]], HB = [['スライダー寄り', -10, 8.5], ['標準', 8.5, 29.5], ['シュート寄り', 29.5, 60]];
  VB.forEach(function (v, vi) { HB.forEach(function (hh, hi) {
    var x1 = c + hh[1] * s, x2 = c + hh[2] * s, y1 = c - v[2] * s, y2 = c - v[1] * s;
    h += '<rect class="fz fz-v' + vi + ' fz-h' + hi + '" x="' + x1 + '" y="' + y1 + '" width="' + (x2 - x1) + '" height="' + (y2 - y1) + '"/>';
  }); });
  VB.forEach(function (v) { h += '<text class="fz-lab" x="' + (c + 60 * s - 3) + '" y="' + (c - (v[1] + v[2]) / 2 * s + 3) + '" text-anchor="end">' + v[0] + '</text>'; });
  HB.forEach(function (hh) { h += '<text class="fz-lab2" x="' + (c + (hh[1] + hh[2]) / 2 * s) + '" y="' + (c - 15 * s + 10) + '" text-anchor="middle">' + hh[0] + '</text>'; });
  h += '<line class="mv-axis" x1="150" y1="0" x2="150" y2="300"/><line class="mv-axis" x1="0" y1="150" x2="300" y2="150"/>';
  h += '<text class="mv-t" x="154" y="12">伸びる ↑</text><text class="mv-t" x="154" y="296">落ちる ↓</text><text class="mv-t" x="296" y="146" text-anchor="end">シュート →</text><text class="mv-t" x="4" y="146">← スライド</text>';
  ps.forEach(function (p) { var x = c + Math.max(-70, Math.min(70, p.x)) * s, y = c - Math.max(-70, Math.min(70, p.y)) * s; h += '<circle class="mv-dot mv-' + (p.t === 'ST' ? 'st' : 'other') + '" cx="' + x + '" cy="' + y + '" r="9"/><text class="mv-lab" x="' + x + '" y="' + (y + 4) + '" text-anchor="middle">' + p.t + '</text>'; });
  return h + '</svg>';
}
function meter(v) { return v == null ? '' : '<div class="meter"><span class="meter-mid"></span><span class="meter-fill ' + dcls(v) + '" style="width:' + Math.max(2, Math.min(100, (v - 20) / 60 * 100)) + '%"></span></div>'; }
function arrow(a, b, k) { if (a == null || b == null) return ''; var d = b - a; return '<span class="chg ' + (d > 0 ? 'up' : d < 0 ? 'down' : 'flat') + '">' + (d > 0 ? '▲ +' : d < 0 ? '▼ ' : '± ') + fmt(d, k) + '</span>'; }
function explain(k, r) { var e = EXPLAIN[k]; if (!e) return ''; var c = e.calc && r ? e.calc(r) : ''; return '<details class="ex"><summary>この数字の見かた</summary><p>' + e.what + '</p><p>' + e.read + '</p>' + (c ? '<p class="ex-calc">' + c + '</p>' : '') + '</details>'; }

// ===== チーム（種目ごとの順位） =====
function drawTeam() {
  var d = S.date, staff = S.D.role === 'staff', meN = S.me && S.me.name;
  var all = R.filter(function (r) { return r.date === d; });
  if (!all.length) return main('<section><h2>' + JP(d) + '</h2><p>まだだれも入力していません。</p></section>');
  var rs = all.filter(function (r) { return (S.f.pos === 'all' || r.pos === S.f.pos) && (S.f.arm === 'all' || r.arm === S.f.arm); });
  var chip = function (key, val, label) { return '<button class="chip' + (S.f[key] === val ? ' on' : '') + '" data-fk="' + key + '" data-fv="' + val + '">' + label + '</button>'; };
  var h = '<section class="filters"><div class="frow"><span class="flabel">選手</span>' + chip('pos', 'all', '全員') + chip('pos', '投手', '投手') + chip('pos', '野手', '野手') + '</div>' +
    '<div class="frow"><span class="flabel">投げる腕</span>' + chip('arm', 'all', 'すべて') + chip('arm', '右投げ', '右') + chip('arm', '左投げ', '左') + '</div>' +
    '<div class="frow"><span class="flabel">種目</span>' + chip('grp', 'all', 'すべて') + chip('grp', 'ラプソード', 'ラプソード') + chip('grp', 'VALD', 'VALD') + chip('grp', '握力', '握力') + '</div>' +
    '<p class="note">' + JP(d) + '・' + rs.length + '人' + (d === S.D.today ? '（入力した人から順に出ます）' : '') + '。順位はこの絞り込みの中での順位、偏差値はチーム全体の中での位置です。</p></section>';
  var board = function (title, key, list, getV, sub) {
    list = list.filter(function (r) { return getV(r) != null; }).sort(function (a, b) { return getV(b) - getV(a); });
    if (!list.length) return '';
    var mx = Math.max.apply(null, list.map(getV)), mn = Math.min.apply(null, list.map(getV));
    var out = '<section class="board"><div class="board-h"><h2>' + title + '</h2>' + (sub ? '<span class="board-sub">' + sub + '</span>' : '') + '</div><ol class="rank">';
    list.forEach(function (r, i) {
      var v = getV(r), p = prevOf(r), dv = key === 'total' ? v : dev(r, key);
      var w = mx === mn ? 100 : 15 + 85 * (v - mn) / (mx - mn);
      out += '<li class="' + (r.name === meN ? 'me' : '') + (i < 3 ? ' top' + (i + 1) : '') + '"><span class="pos">' + (i + 1) + '</span>' +
        '<span class="who">' + (staff ? '<a href="#" data-n="' + esc(r.name) + '">' + esc(r.name) + '</a>' : esc(r.name)) + '<small>' + esc(r.pos || '') + '</small></span>' +
        '<span class="bar-wrap"><span class="rbar ' + dcls(dv) + '" style="width:' + w + '%"></span></span>' +
        '<span class="val">' + (key === 'total' ? v.toFixed(0) : fmt(v, key)) + '</span>' +
        '<span class="sub2">' + (key === 'total' ? '' : '偏差値 ' + (dv == null ? '—' : dv.toFixed(0))) + (p ? ' ' + arrow(key === 'total' ? total(p) : p[key], v, key) : '') + '</span></li>';
    });
    return out + '</ol>' + (key !== 'total' ? explain(key) : '') + '</section>';
  };
  h += '<div class="boards">' + board('総合偏差値', 'total', rs, total, '順位をつける項目の偏差値の平均');
  RANKED.forEach(function (m) { if (S.f.grp !== 'all' && S.f.grp !== m.g) return; h += board(m.l, m.k, rs, function (r) { return r[m.k]; }, (m.en ? m.en + '・' : '') + m.u + (m.ref ? '・基準 ' + m.ref : '')); });
  if (staff) {
    var warn = rs.map(function (r) { return { r: r, w: rom(r).filter(function (x) { return x.st === 'warn'; }) }; }).filter(function (x) { return x.w.length; });
    if (warn.length) h += '<section class="board romwarn"><div class="board-h"><h2>可動域で注意がある選手</h2><span class="board-sub">先生・トレーナーだけに表示</span></div><ul>' + warn.map(function (x) { return '<li><a href="#" data-n="' + esc(x.r.name) + '">' + esc(x.r.name) + '</a>：' + x.w.map(function (w) { return w.label; }).join('／') + '</li>'; }).join('') + '</ul></section>';
  }
  h += '</div>';
  main(h);
  document.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { S.f[b.dataset.fk] = b.dataset.fv; drawTeam(); }; });
  document.querySelectorAll('a[data-n]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); S.player = a.dataset.n; go('player'); }; });
}

// ===== 1人 =====
function drawPlayer(n) {
  var rs = R.filter(function (r) { return r.name === n; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  if (!rs.length) return main('<section><h2>' + esc(n) + '</h2><p>まだ記録がありません。「入力する」から入れてください。</p></section>');
  var last = rs.filter(function (r) { return r.date <= S.date; }).pop() || rs[rs.length - 1];
  var prev = prevOf(last);
  var items = RANKED.filter(function (m) { return EXPLAIN[m.k]; });
  var now = items.map(function (m) { return dev(last, m.k); }), pv = prev ? items.map(function (m) { return dev(prev, m.k); }) : null;
  var t = total(last), tp = prev ? total(prev) : null;
  // 伸びた・伸ばしたい
  var DG = diagnose(last);
  var good = items.map(function (m, i) { return { m: m, v: now[i] }; }).filter(function (x) { return x.v != null; }).sort(function (a, b) { return b.v - a.v; });
  var h = '<section class="hero"><div class="hero-l"><div class="hero-name">' + esc(n) + '</div><div class="hero-meta">' + esc(last.pos || '') + '・' + esc(last.arm || '') + '　' + JP(last.date) + '</div>' +
    '<div class="hero-score"><span class="hs-label">総合偏差値</span><span class="hs-num">' + (t == null ? '—' : t.toFixed(0)) + '</span>' + (tp != null && t != null ? arrow(tp, t, 'x') : '') + '</div>' +
    (good.length ? '<div class="hero-tags"><span class="tag good">強み：' + good.slice(0, 2).map(function (x) { return EXPLAIN[x.m.k].s; }).join('・') + '</span><span class="tag work">伸びしろ：' + good.slice(-2).reverse().map(function (x) { return EXPLAIN[x.m.k].s; }).join('・') + '</span></div>' : '') +
    (DG.type && DG.type[0] ? '<div class="dg-type"><span class="dg-badge">' + DG.type[0] + '</span>' + DG.type[1] + '</div>' : (DG.type ? '<div class="dg-type">' + DG.type[1] + '</div>' : '')) +
    '</div><div class="hero-r">' + radar(items, now, pv) + '<div class="legend"><i class="lg-now"></i>' + SH(last.date) + (prev ? '<i class="lg-prev"></i>' + SH(prev.date) + '（前回）' : '') + '<span>線の外ほどチームの中で上（真ん中の太線＝50）</span></div></div></section>';
  h += '<section class="diag"><h2>この選手の見立て</h2>' + (good.length ? '<div class="dg-h">伸びしろが、投球にどうつながるか</div><ul class="dg-list">' + growthLinks(items, now) + '</ul>' : '') +
    DG.lines.map(function (l) { return '<div class="dg-line' + (l[0].indexOf('⚠️') === 0 ? ' risk' : '') + '"><b>' + l[0] + '</b><p>' + l[1] + '</p></div>'; }).join('') +
    '<p class="note">タイプ分けは、VALD5項目の偏差値の平均と球速の偏差値を、チームの真ん中（50）で分けたもの。体重あたりの目安はDIMENSIONINGの145km/h投手の基準。1回の測定での位置なので、断定ではありません。</p></section>';
  var g = '';
  h += '<div class="cards2">';
  items.forEach(function (m) {
    if (m.g !== g) { g = m.g; h += '<h2 class="grp">' + g + '</h2>'; }
    var v = last[m.k], dv = dev(last, m.k), k = rank(last, m.k);
    h += '<section class="mcard"><div class="mc-h"><span class="mc-name">' + m.l + '</span>' + (m.en ? '<span class="mc-en">' + m.en + '</span>' : '') + '</div>' +
      '<div class="mc-body"><span class="mc-val">' + fmt(v, m.k) + '<small>' + m.u + '</small></span>' + (prev ? arrow(prev[m.k], v, m.k) : '') + '</div>' +
      '<div class="mc-rank">' + (k ? '<b>' + k.n + '人中 ' + k.r + '位</b>' : '—') + '<span>偏差値 ' + (dv == null ? '—' : dv.toFixed(0)) + '</span></div>' + meter(dv) + explain(m.k, last) + '</section>';
  });
  h += '</div><p class="note">' + VALD_NOTE + '</p>';
  // 可動域：部位ごとに左右を並べ、下に判定
  var rr = rom(last);
  h += '<h2 class="grp">可動域（順位はつけず、基準と左右差で見る）</h2><div class="rjoints">' + romJoints(last, prev) + '</div>';
  h += '<section class="romcheck"><h3>チェック</h3><ul>' + rr.map(function (c) { return '<li class="' + c.st + '"><span class="rc-st">' + romCell(c) + '</span><span class="rc-l">' + c.label + (c.val != null ? '：<b>' + c.val + (typeof c.val === 'number' ? '°' : '') + '</b>' : '') + '</span><small>' + c.why + '</small></li>'; }).join('') + '</ul></section>';
  // 球の中身
  var FB = fbClass(last);
  h += '<h2 class="grp">球の中身（順位はつけない）</h2><section class="pitchsec"><div class="pitch-flex"><div>' + movement(last) + '<p class="note">点＝球種ごとの平均。色の帯＝ストレートの区分（縦：伸び・標準・垂れ／横：スライダー寄り・標準・シュート寄り）。上ほど「伸びる」、右ほど「シュート」' + (last.arm === '左投げ' ? '（左投手なので左右を反転して表示）' : '') + '。</p></div><div class="pitch-info">' +
    (FB ? '<div class="plan"><div class="plan-q">ストレートの変化量</div><p class="fb-cls"><span class="fbv fbv-' + FB.vi + '">縦：' + FB.v + '</span><span class="fbh fbh-' + FB.hi + '">横：' + FB.h + '</span></p><p class="note">縦 ' + fmt(last.vb) + 'cm・横 ' + fmt(last.hb) + 'cm（ストレートの平均）。縦は47cm以上＝伸び／39〜46cm＝標準／38cm以下＝垂れ。横は8cm以下＝スライダー寄り／9〜29cm＝標準／30cm以上＝シュート寄り' + (last.arm === '左投げ' ? '（左投手は左右を反転して判定）' : '') + '。</p></div>' : '');
  ['eff', 'gyro', 'vb', 'hb'].forEach(function (k) {
    h += '<div class="pi"><span class="pi-n">' + EXPLAIN[k].s + '（ストレート）</span><span class="pi-v">' + fmt(last[k]) + '</span>' + (prev ? '<span class="pi-p">前回 ' + fmt(prev[k]) + '</span>' : '') + explain(k) + '</div>';
  });
  h += '</div></div><details class="ex"><summary>球種ごとの数字（表）</summary><div class="scroll"><table><tr><th class="l">球種</th><th>球数</th><th>平均球速</th><th>最高球速</th><th>回転数</th><th>トゥルースピン</th><th>回転効率</th><th>ジャイロ</th><th>縦変化</th><th>横変化</th></tr>';
  Object.keys(last.pitches).sort(function (a, b) { return a === 'ST' ? -1 : b === 'ST' ? 1 : 0; }).forEach(function (tt) {
    var x = last.pitches[tt]; h += '<tr><td class="l">' + tt + '</td><td>' + x.n + '</td><td>' + fmt(x.speed) + '</td><td>' + fmt(x.speedMax) + '</td><td>' + fmt(x.spin, 'spin') + '</td><td>' + fmt(x.tspin, 'tspin') + '</td><td>' + fmt(x.eff) + '</td><td>' + fmt(x.gyro) + '</td><td>' + fmt(x.vb) + '</td><td>' + fmt(x.hb) + '</td></tr>';
  });
  h += '</table></div></details></section>';
  // これまでの推移
  if (rs.length > 1) {
    h += '<details class="ex history"><summary>これまでの記録（' + rs.length + '回）</summary><div class="scroll"><table><tr><th class="l">項目</th>' + rs.map(function (r) { return '<th>' + SH(r.date) + '</th>'; }).join('') + '</tr>';
    items.forEach(function (m) { h += '<tr><td class="l">' + m.l + '</td>' + rs.map(function (r) { return '<td>' + fmt(r[m.k], m.k) + '</td>'; }).join('') + '</tr>'; });
    h += '</table></div></details>';
  }
  main(h);
}

// ===== 入力状況（先生・トレーナー） =====
function drawStatus() {
  var d = S.date, it = S.D.items;
  var names = NAMES();
  var has = function (r, list) { if (!r) return 0; return list.filter(function (m) { return r[m.k] != null; }).length; };
  var h = '<section><h2>' + JP(d) + '　入力状況</h2><p class="note">去年までに測った人＋今回入れた人。数字は「入った項目の数／全部の数」。名前を押すとその人の結果。</p><div class="scroll"><table><tr><th class="l">名前</th><th>ラプソード（球数）</th><th>VALD</th><th>可動域</th><th>握力</th><th>体</th><th class="l">最後に入れた時刻</th></tr>';
  names.forEach(function (n) {
    var r = rec(d, n);
    var cell = function (k, all) { return '<td class="' + (k === 0 ? 'warn' : k < all ? 'part' : 'ok') + '">' + k + '／' + all + '</td>'; };
    h += '<tr><td class="l"><a href="#" data-n="' + esc(n) + '">' + esc(n) + '</a></td>' +
      '<td class="' + (r && r.pl.length ? 'ok' : 'warn') + '">' + (r ? r.pl.length : 0) + '球</td>' + cell(has(r, it.vald), it.vald.length) + cell(has(r, it.rom), it.rom.length) + cell(has(r, it.grip), it.grip.length) + cell(has(r, it.info), it.info.length) +
      '<td class="l ref">' + (r && r.updated ? esc(String(r.updated).replace('T', ' ').slice(0, 16)) : '') + '</td></tr>';
  });
  h += '</table></div>' + (S.D.sheetUrl ? '<p><a href="' + S.D.sheetUrl + '" target="_blank">スプレッドシート（元のデータ）を開く</a></p>' : '') + '</section>';
  main(h);
  document.querySelectorAll('a[data-n]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); S.player = a.dataset.n; go('player'); }; });
}

function drawAbout() {
  var card = function (k) { var e = EXPLAIN[k]; return '<section class="mcard"><div class="mc-h"><span class="mc-name">' + (e.en || e.s) + '</span>' + (e.en ? '<span class="mc-en">' + e.s + '</span>' : '') + '</div><p>' + e.what + '</p><p class="note">' + e.read + '</p></section>'; };
  main('<h2 class="grp">ラプソード（投球）</h2><div class="cards2">' + ['speed_max', 'spin', 'tspin', 'eff', 'gyro', 'vb', 'hb'].map(card).join('') + '</div>' +
    '<h2 class="grp">VALD（反動をつけたジャンプ）</h2><p class="note">VALDは、1回のジャンプを「しゃがむ（ブレーキ）→ 押す → 跳ぶ」に分けて測ります。野球にいちばん近いのは<b>ブレーキ</b>の局面＝投球の踏み出し脚、打撃の踏み込みで「前に進む体を止めて、回転に変える」動きです。</p><div class="cards2">' + ['jh', 'ci', 'ci100', 'rfd', 'pp'].map(card).join('') + '</div><p class="note">' + VALD_NOTE + '</p>' +
    '<h2 class="grp">握力・可動域</h2><div class="cards2">' + card('grip_throw') +
    '<section class="mcard"><div class="mc-h"><span class="mc-name">可動域</span></div><p>広いほど良いわけではないので、<b>順位はつけません</b>。基準に届いているかと、左右の差で見ます。</p><p class="note">肩は、投げる側のトータルアーク（内旋＋外旋）が反対側より5°より大きく少ないと、肩のけがが約1.9倍。投げる側の外旋が反対側より5°以上多くないと約2.2倍（プロ投手の研究・Wilk 2011/2015）。全員分は先生・トレーナーの画面だけに出ます。</p></section></div>' +
    '<section><h2>偏差値の見かた</h2><p>50＝チームの真ん中、60＝上から約16%、40＝下から約16%。<b>同じ日に測った十数人の中での位置</b>なので、全国の基準ではありません。今回の分は、入力した人が増えるたびに少し動きます。</p></section>');
}

start();
</script>
</body></html>
